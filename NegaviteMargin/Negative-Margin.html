<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negative Margin Example</title>
</head>
<body>
    <div style="width: 420px; background-color: silver; padding: 10px; margin-block-start: 100px; border: 1px solid;">
        <p class="neg" style="margin-block-start: -50px; border: 3px solid gray;">
          Un párrafo con margen negativo arriba.
        </p>
        Otro contenido dentro del div.
      </div>
      <div style="width: 420px; background-color: silver; border: 1px solid; margin-block-start: 50px;">
        <p class="neg" style="margin-block-end: -50px; border: 3px solid gray;">
          Un párrafo con margen negativo abajo.
        </p>
      </div>
      <p>
        El siguiente párrafo.
      </p>
      <div style="position: relative; background: lightgray; padding: 20px;">
        <img src="imagen.jpg" style="width: 200px; height: 200px; margin-block-start: 10px;">
        <p>Este texto se ajusta debajo de la imagen que ha subido.</p>
      </div>
      
</body>
</html>
